<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting · Garrick Tse</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://garricktse.com/#work">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/styles.css">

<!-- The old gallery lived at gallery.html?project=<key>. Those URLs may still
     be linked from elsewhere, so each key is mapped to where its content now
     lives rather than being allowed to 404. Projects without a case study land
     on the work index, where their row expands in place. -->
<script>
(function () {
  var map = {
    'neurocalm': '/work/neurocalm/',
    'stock': '/#work',
    '3d-rendering': '/#work',
    'android-mood': '/#work'
  };
  var key = new URLSearchParams(location.search).get('project');
  location.replace(map[key] || '/#work');
})();
</script>
</head>
<body>
<main id="main" class="container notfound">
  <p class="eyebrow">Moved</p>
  <h1 class="t-h1">This gallery has moved.</h1>
  <p class="t-lead" style="max-width:52ch;margin-top:var(--s-5)">
    Project screenshots now live on the work index and the individual case
    study pages.
  </p>
  <div class="notfound__actions">
    <a class="btn btn--primary" href="/#work">Selected work</a>
    <a class="btn btn--secondary" href="/">Home</a>
  </div>
</main>
</body>
</html>
