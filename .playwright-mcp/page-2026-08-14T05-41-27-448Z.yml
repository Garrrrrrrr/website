            - button "What's included in the free trial?" [ref=e854] [cursor=pointer]
            - paragraph [ref=e859]: "The 14-day free trial includes full access to every feature: all training drills, results tracking, EV calculator, Monte Carlo simulator, career mode, forum access, and game directory. No features are locked during your trial."
          - generic [ref=e862]:
            - button "What counting system do you teach?" [ref=e863] [cursor=pointer]
            - paragraph [ref=e868]: We use the Hi-Lo system exclusively. It was good enough for the MIT Blackjack Team to win millions from casinos, and it's good enough for us. Hi-Lo strikes the perfect balance between power and simplicity, easy to learn, yet highly effective in real play.
          - generic [ref=e871]:
            - button "Is card counting legal?" [ref=e872] [cursor=pointer]
            - paragraph [ref=e877]: Yes, card counting is legal in most jurisdictions. It's simply using your brain to track cards, no devices or cheating involved. However, casinos are private businesses and can ask you to leave or refuse your action if they suspect you're counting.
          - generic [ref=e880]:
            - button "What games can I track with the results tracker?" [ref=e881] [cursor=pointer]
            - paragraph [ref=e886]: You can track results from any game you want; blackjack, poker, sports betting, or any other advantage play pursuit. You can view all your profits in one place, eliminating the need to add it up across separate programs. The tracker is fully customizable with custom game types, session fields, and analytics tailored to your needs.
          - generic [ref=e889]:
            - button "How do team bankrolls work?" [ref=e890] [cursor=pointer]
            - paragraph [ref=e895]: Team bankrolls allow multiple users to contribute to and track a shared bankroll. Each member can log sessions, and the system automatically tracks individual contributions, profit splits, and team performance metrics. Perfect for AP teams.
          - generic [ref=e898]:
            - button "Can I import my existing results data?" [ref=e899] [cursor=pointer]
            - paragraph [ref=e904]: Yes! You can import results from CSV files, making it easy to bring in historical data from spreadsheets or other tracking apps. We support common export formats so you can seamlessly continue tracking where you left off.
          - generic [ref=e907]:
            - button "Can I use AP Toolbox on mobile?" [ref=e908] [cursor=pointer]
            - paragraph [ref=e913]: Yes! Log sessions on the go, practice drills during your commute, or check game conditions from anywhere.
          - generic [ref=e916]:
            - button "How does the trial billing work?" [ref=e917] [cursor=pointer]
            - paragraph [ref=e922]: When you start your trial, we'll ask for a payment method to verify your account. You won't be charged during the 14-day trial period. If you don't cancel before the trial ends, your subscription will begin at $17.99/month. You can cancel anytime.
          - generic [ref=e925]:
            - button "Is my data private?" [ref=e926] [cursor=pointer]
            - paragraph [ref=e931]: Absolutely. We take privacy seriously. Your results data, forum posts, and personal information are all private by default. We never share or sell user data.
