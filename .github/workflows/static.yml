# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Copy everything except an explicit deny list, rather than naming each
      # file to include. The previous approach silently dropped any new page
      # that was not added here by hand.
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'uth-solver' \
            --exclude 'images/_originals' \
            --exclude 'writing/_template.html' \
            --exclude '.playwright-mcp' \
            --exclude '.claude' \
            --exclude 'node_modules' \
            --exclude '.gitignore'
          touch _site/.nojekyll
      - name: Verify expected pages are present
        run: |
          for f in index.html 404.html gallery.html CNAME robots.txt \
                   sitemap.xml site.webmanifest favicon.svg favicon.ico \
                   work/countlab/index.html \
                   work/gateway-training/index.html \
                   work/neurocalm/index.html \
                   writing/index.html \
                   assets/css/tokens.css assets/css/styles.css \
                   assets/js/main.js assets/js/raytracer.js; do
            test -f "_site/$f" || { echo "::error::missing _site/$f"; exit 1; }
          done
          test ! -f _site/writing/_template.html || { echo "::error::template leaked into build"; exit 1; }
          echo "All expected files present."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
